spring.application.name=DealerFlow
# Azure App Service sets PORT; local default is 8080
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:classpath:application-local.properties
jwt.expiration-ms=86400000
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
jwt.secret=${JWT_SECRET}

spring.datasource.url=jdbc:mysql://localhost:3306/dealer_flow
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Python API integration
python-api.base-url=http://158.23.62.159:4242
python-api.connect-timeout=${PYTHON_API_CONNECT_TIMEOUT:2s}
python-api.read-timeout=${PYTHON_API_READ_TIMEOUT:10s}

