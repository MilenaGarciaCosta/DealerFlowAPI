spring.application.name=DealerFlow
# Azure App Service sets PORT; local default is 8080
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:classpath:application-local.properties
jwt.expiration-ms=86400000
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Python API integration
python-api.base-url=${PYTHON_API_BASE_URL:http://172.16.0.4:4242}
python-api.connect-timeout=${PYTHON_API_CONNECT_TIMEOUT:2s}
python-api.read-timeout=${PYTHON_API_READ_TIMEOUT:10s}
