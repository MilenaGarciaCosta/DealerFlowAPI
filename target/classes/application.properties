spring.application.name=DealerFlow
# Azure App Service sets PORT; local default is 8080
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:classpath:application-local.properties
jwt.expiration-ms=86400000
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
jwt.secret=${JWT_SECRET}

spring.datasource.url=jdbc:mysql://localhost:3306/dealer_flow
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

azure.application-insights.connection-string=InstrumentationKey=bdf3e79b-bd4e-4614-a35d-c6f574243d1f;IngestionEndpoint=https://mexicocentral-0.in.applicationinsights.azure.com/;LiveEndpoint=https://mexicocentral.livediagnostics.monitor.azure.com/;ApplicationId=1ec763e3-ed39-4084-9bd5-d8a2fc75430b
logging.level.com.example.DealerFlow=WARN
logging.level.org.springframework.security=WARN